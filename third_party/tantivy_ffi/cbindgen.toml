# cbindgen config: Rust FFI -> C header generator.
# Invoked by build.rs, outputs to $OUT_DIR/paimon_tantivy_ffi.h.
# CMake picks up $OUT_DIR via Corrosion and adds it to the C++ include path.

language = "C"

# Header banner written at the top of the generated file.
header = """
/* Copyright 2026-present Alibaba Inc. */
/*
 * AUTO-GENERATED by cbindgen from Rust sources under third_party/tantivy_ffi - DO NOT EDIT.
 *
 * C ABI for paimon_tantivy_ffi. See docs/dev/tantivy_ffi_design.md for contract.
 */
#pragma once
"""

include_guard = "PAIMON_TANTIVY_FFI_H"
cpp_compat = true
pragma_once = false   # already written by hand in the header banner above
documentation = true
documentation_style = "c"
line_length = 100
tab_width = 4

[export]
# No type prefix (Rust type names already carry the PaimonTantivy... prefix).
# Function names already start with paimon_tantivy_ (named that way in the Rust source).
prefix = ""
# Force-export types that only appear as handles / return values; cbindgen does
# not export them by default when no FFI function directly takes/returns them,
# so list them explicitly here.
include = ["PaimonTantivyStatus"]

[export.rename]
# Rust enum name -> C typedef name (to avoid duplicated prefixes, etc.)

[fn]
prefix = ""
args = "auto"
rename_args = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
derive_helper_methods = false

[parse]
parse_deps = false
