# Pin the Rust toolchain used to build paimon_tantivy_ffi so Corrosion can
# resolve a non-empty toolchain name during a fresh CMake configure.
#
# Only the `channel` is pinned — no extra components, because rustup in
# CI/containers may lack network access to fetch clippy/rustfmt, and build
# doesn't need them.
[toolchain]
channel = "stable"
profile = "minimal"
