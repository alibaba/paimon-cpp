name: Build and Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc-14
            cxx: g++-14
            build_args: --build_type Release
          - name: clang-release
            build_args: --build_type Release
          - name: gcc-debug
            cc: gcc-14
            cxx: g++-14
          - name: clang-debug
            fetch_depth: '0' # fetch the PR target branch history for clang-tidy
            enable_core_dumps: true # print a backtrace when a test crashes
            build_args: >-
              --check_clang_tidy
              --lint_git_target_commit "origin/${{ github.base_ref || github.event.repository.default_branch }}"
          - name: asan-ubsan
            build_args: --enable_asan --enable_ubsan
          - name: tsan
            skip_rust: true
            build_args: --enable_tsan
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
          fetch-depth: ${{ matrix.fetch_depth || '1' }}
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-${{ matrix.name }}
      - name: Install Rust toolchain (tantivy-fts)
        if: ${{ !matrix.skip_rust }}
        shell: bash
        run: ci/scripts/setup_rust.sh
      - name: Install HTTP and TLS development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Enable core dumps
        if: ${{ matrix.enable_core_dumps }}
        shell: bash
        run: |
          sudo apt-get install -y gdb
          # build_support/run-test.sh runs each test inside its own working
          # directory and looks for `core.<executable>*` there afterwards, so the
          # core file must be written relative to the crashing process.
          sudo sysctl -w kernel.core_pattern=core.%e.%p
          cat /proc/sys/kernel/core_pattern
          echo "PAIMON_ENABLE_CORE_DUMPS=1" >> "$GITHUB_ENV"
      - name: Build Paimon
        shell: bash
        env:
          CC: ${{ matrix.cc || 'clang' }}
          CXX: ${{ matrix.cxx || 'clang++' }}
        run: >-
          ci/scripts/build_paimon.sh
          --source_dir "$(pwd)"
          ${{ matrix.build_args }}
      - name: Show ccache statistics
        if: always()
        run: ccache -s
