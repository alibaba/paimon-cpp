name: Build and Test

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc-14
            cxx: g++-14
            fetch_depth: 1
            build_args: --build_type Release
          - name: clang-release
            cc: clang
            cxx: clang++
            fetch_depth: 1
            build_args: --build_type Release
          - name: gcc-debug
            cc: gcc-14
            cxx: g++-14
            fetch_depth: 1
            build_args: ''
          - name: clang-debug
            cc: clang
            cxx: clang++
            fetch_depth: 0 # fetch the PR target branch history for clang-tidy
            build_args: >-
              --check_clang_tidy
              --lint_git_target_commit "origin/${{ github.base_ref || github.event.repository.default_branch }}"
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
          fetch-depth: ${{ matrix.fetch_depth }}
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-${{ matrix.name }}
      - name: Install Rust toolchain (tantivy-fts)
        shell: bash
        run: ci/scripts/setup_rust.sh
      - name: Build Paimon
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          ci/scripts/build_paimon.sh
          --source_dir "$(pwd)"
          ${{ matrix.build_args }}
      - name: Show ccache statistics
        if: always()
        run: ccache -s
