name: Test with sanitizer

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-with-sanitizer:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            sanitizer_args: --enable_asan --enable_ubsan
            setup_rust: true
          - sanitizer: tsan
            sanitizer_args: --enable_tsan
            setup_rust: false
    steps:
      - name: Checkout paimon-cpp
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-${{ matrix.sanitizer }}
      - name: Install Rust toolchain (tantivy-fts)
        if: matrix.setup_rust
        shell: bash
        run: ci/scripts/setup_rust.sh
      - name: Build Paimon
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: >-
          ci/scripts/build_paimon.sh
          --source_dir "$(pwd)"
          ${{ matrix.sanitizer_args }}
      - name: Show ccache statistics
        if: always()
        run: ccache -s
